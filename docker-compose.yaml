# Data Governance RAG — Docker 编排
#
# 开发/测试用法（虚拟机里）:
#   docker compose run --rm ingest             # 灌库
#   docker compose run --rm web python -m rag.pipeline   # 命令行问答测试
#   docker compose up -d web                    # 启动 Web 服务
#   → 浏览器访问 http://localhost:8766
#
# 部署（ECS，走全局网关）:
#   web 容器加入 app-public-net，由 nginx-gateway 反代
#   ingest 是一次性灌库，不入公共网络

services:
  # ============================================================
  # 灌库（CLI 容器，一次性运行）
  # ============================================================
  ingest:
    build: .
    container_name: dg-rag-ingest
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DASHSCOPE_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - DASHSCOPE_CHAT_MODEL=${DASHSCOPE_CHAT_MODEL:-qwen-max}
      - DASHSCOPE_EMBEDDING_MODEL=${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v3}
      - CHROMA_DIR=/app/data/chroma
      - AUTH_DB_PATH=/app/data/auth.db
      - TZ=Asia/Shanghai
    volumes:
      - ./Docs:/app/Docs
      - ./data:/app/data
    command: ["python", "-m", "ingest.ingest"]
    restart: "no"
    mem_limit: 1g

  # ============================================================
  # Web 服务（长期运行，团队访问）
  # ============================================================
  web:
    build: .
    container_name: dg-rag-web
    expose:
      - "8766"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - DASHSCOPE_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - DASHSCOPE_CHAT_MODEL=${DASHSCOPE_CHAT_MODEL:-qwen-max}
      - DASHSCOPE_EMBEDDING_MODEL=${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v3}
      - CHROMA_DIR=/app/data/chroma
      - AUTH_DB_PATH=/app/data/auth.db
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
    command: ["gunicorn", "-w", "2", "-k", "uvicorn.workers.UvicornWorker",
          "web.app:app", "--bind", "0.0.0.0:8766", "--timeout", "300"]
    depends_on:
      - ingest
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - default      # 项目内部网络（ingest 用；实际 web 与 ingest 不直接通信，保留无害）
      - public       # 全局网络，由 nginx-gateway 反代访问

networks:
  public:
    external: true
    name: app-public-net