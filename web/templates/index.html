<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 数据治理知识库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background: #f5f6fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #1a1a2e;
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header .right { display: flex; gap: 12px; align-items: center; }
        .header .user-tag { font-size: 13px; color: #a0a8c0; }
        .header .btn {
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-login { background: #4361ee; }
        .btn-logout { background: #e94560; }

        /* 登录页 */
        #loginPage {
            flex: 1; display: flex;
            align-items: center; justify-content: center;
            flex-direction: column;
        }
        .login-card {
            background: #fff; border-radius: 12px;
            padding: 40px 36px; width: 360px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-card h2 { margin-bottom: 24px; color: #1a1a2e; }
        .login-card input {
            width: 100%; padding: 11px 14px;
            border: 1px solid #ccc; border-radius: 8px;
            font-size: 14px; margin-bottom: 14px; outline: none;
        }
        .login-card input:focus { border-color: #4361ee; }
        .login-card button {
            width: 100%; background: #4361ee; color: #fff;
            border: none; padding: 12px; border-radius: 8px;
            cursor: pointer; font-size: 15px; font-weight: 600;
        }
        .login-card .error { color: #e94560; font-size: 13px; margin-top: 10px; min-height: 18px; }
        .demo-accounts { margin-top: 18px; font-size: 12px; color: #999; line-height: 1.8; }

        /* 聊天页 */
        #chatPage { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .chat-box { flex: 1; overflow-y: auto; padding: 20px 24px; max-width: 860px; width: 100%; margin: 0 auto; }

        .message { margin-bottom: 16px; display: flex; flex-direction: column; }
        .message.user { align-items: flex-end; }
        .message.assistant { align-items: flex-start; }

        .bubble {
            max-width: 80%; padding: 12px 16px; border-radius: 12px;
            line-height: 1.7; font-size: 14px; word-wrap: break-word;
        }
        .message.user .bubble { background: #4361ee; color: #fff; border-bottom-right-radius: 4px; }
        .message.assistant .bubble { background: #fff; color: #333; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }

        /* 答案内的 Markdown */
        .bubble h1 { font-size: 17px; margin: 10px 0 6px; }
        .bubble h2 { font-size: 16px; margin: 8px 0 4px; }
        .bubble h3 { font-size: 15px; margin: 6px 0 4px; }
        .bubble p { margin: 4px 0; }
        .bubble ul, .bubble ol { padding-left: 20px; margin: 4px 0; }
        .bubble li { margin: 2px 0; }
        .bubble strong { color: #1a1a2e; }
        .bubble blockquote {
            border-left: 3px solid #4361ee; margin: 8px 0;
            padding: 4px 12px; color: #555; background: #f8f9ff;
        }
        .bubble code { background: #f0f0f0; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
        .bubble pre { background: #f6f8fa; padding: 12px; border-radius: 8px; overflow-x: auto; }

        /* 溯源 */
        .sources {
            margin: 8px 0 0; font-size: 12px; color: #666;
        }
        .source-item {
            display: inline-block; background: #f0f2ff; color: #4361ee;
            border: 1px solid #d5dbff; border-radius: 6px;
            padding: 2px 10px; margin: 2px 4px 2px 0; cursor: pointer;
        }

        /* 输入区 */
        .input-area {
            background: #fff; border-top: 1px solid #e0e0e0;
            padding: 12px 24px; display: flex; gap: 12px;
            max-width: 860px; width: 100%; margin: 0 auto;
        }
        .input-area input {
            flex: 1; padding: 11px 14px; border: 1px solid #ccc;
            border-radius: 8px; font-size: 14px; outline: none;
        }
        .input-area input:focus { border-color: #4361ee; }
        .input-area button {
            background: #4361ee; color: #fff; border: none;
            padding: 11px 24px; border-radius: 8px; cursor: pointer; font-size: 14px;
        }
        .input-area button:disabled { background: #a0a8c0; }

        .loading { color: #4361ee; font-size: 13px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>📚 数据治理知识库</h1>
        <div class="right">
            <span class="user-tag" id="userTag"></span>
            <button class="btn btn-login" id="btnLogin" onclick="showLogin()">登录</button>
            <button class="btn btn-logout" id="btnLogout" style="display:none" onclick="doLogout()">退出</button>
        </div>
    </div>

    <!-- 登录页 -->
    <div id="loginPage">
        <div class="login-card">
            <h2>🔐 登录</h2>
            <input id="loginUsername" placeholder="用户名" />
            <input id="loginPassword" type="password" placeholder="密码" />
            <button onclick="doLogin()">登 录</button>
            <div class="error" id="loginError"></div>
            <div class="demo-accounts">
                演示账号：<br>
                admin / admin123（管理员）<br>
                member / member123（成员）
            </div>
        </div>
    </div>

    <!-- 聊天页 -->
    <div id="chatPage" style="display:none">
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input id="questionInput" placeholder="输入问题，如：数据资产盘点的核心步骤是什么？" />
            <button id="sendBtn" onclick="send()">发送</button>
        </div>
    </div>

    <script>
        function getToken() { return localStorage.getItem('dg_token'); }
        function setToken(t) { localStorage.setItem('dg_token', t); }
        function clearToken() { localStorage.removeItem('dg_token'); }
        function getUser() { return localStorage.getItem('dg_user'); }
        function setUser(u) { localStorage.setItem('dg_user', u); }
        function clearUser() { localStorage.removeItem('dg_user'); }

        function showChat() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('chatPage').style.display = 'flex';
            document.getElementById('btnLogin').style.display = 'none';
            document.getElementById('btnLogout').style.display = 'inline-block';
            document.getElementById('userTag').textContent = getUser();
        }
        function showLogin() {
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('chatPage').style.display = 'none';
            document.getElementById('btnLogin').style.display = 'inline-block';
            document.getElementById('btnLogout').style.display = 'none';
            document.getElementById('userTag').textContent = '';
        }

        async function doLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!username || !password) { document.getElementById('loginError').textContent = '请输入用户名和密码'; return; }

            try {
                const r = await fetch('/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const d = await r.json();
                if (r.ok) {
                    setToken(d.token); setUser(d.username);
                    document.getElementById('loginError').textContent = '';
                    showChat();
                } else {
                    document.getElementById('loginError').textContent = d.error || '登录失败';
                }
            } catch(e) { document.getElementById('loginError').textContent = '请求失败'; }
        }

        async function doLogout() {
            const token = getToken();
            if (token) { try { await fetch('/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }); } catch(e){} }
            clearToken(); clearUser(); showLogin();
        }

        // 极简 Markdown 渲染（够用即可：标题/列表/粗体/引用/代码）
        function md(text) {
            let s = text.replace(/&/g, '&amp;').replace(/</g, '&lt;');
            s = s.replace(/^### (.*)$/gm, '<h3>$1</h3>');
            s = s.replace(/^## (.*)$/gm, '<h2>$1</h2>');
            s = s.replace(/^# (.*)$/gm, '<h1>$1</h1>');
            s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/^(> .*)$/gm, '<blockquote>$1</blockquote>');
            s = s.replace(/^\d+\.\s+(.*)$/gm, '<ol><li>$1</li></ol>');
            s = s.replace(/^[-*]\s+(.*)$/gm, '<li>$1</li>');
            // 合并连续的 <li> 为列表
            s = s.replace(/<li>(.*?)<\/li>(\s*<li>)/g, '<li>$1$2');
            s = s.replace(/(<li>.*?<\/li>)(?![\s\S]*<\/li>)/g, '$1');
            s = s.replace(/\n\n/g, '<br>');
            return s;
        }

        function addMessage(role, content, sources) {
            const box = document.getElementById('chatBox');
            const msg = document.createElement('div');
            msg.className = 'message ' + role;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = md(content);
            msg.appendChild(bubble);

            if (sources && sources.length) {
                const src = document.createElement('div');
                src.className = 'sources';
                src.innerHTML = '📄 来源: ';
                sources.forEach(s => {
                    const el = document.createElement('span');
                    el.className = 'source-item';
                    el.textContent = s.source.replace('.md', '');
                    el.title = s.path || '';
                    src.appendChild(el);
                });
                msg.appendChild(src);
            }

            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        async function send() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            const token = getToken();
            if (!token) { showLogin(); return; }

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;

            addMessage('user', question);
            input.value = '';

            const box = document.getElementById('chatBox');
            const loading = document.createElement('div');
            loading.className = 'message assistant';
            loading.innerHTML = '<div class="bubble"><span class="loading">正在检索知识库...</span></div>';
            loading.id = 'loading';
            box.appendChild(loading);
            box.scrollTop = box.scrollHeight;

            try {
                const r = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ question }),
                });
                const d = await r.json();
                document.getElementById('loading').remove();
                if (r.status === 401) { clearToken(); clearUser(); showLogin(); return; }
                if (d.error) { addMessage('assistant', '❌ ' + d.error); }
                else { addMessage('assistant', d.answer, d.sources); }
            } catch(e) {
                document.getElementById('loading').remove();
                addMessage('assistant', '❌ 请求失败');
            } finally { btn.disabled = false; input.focus(); }
        }

        document.getElementById('questionInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') send(); });

        // 初始化
        (function init() {
            if (getToken() && getUser()) showChat();
            else showLogin();
        })();
    </script>
</body>
</html>
